<!DOCTYPE html><html><head>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans+KR:wght@300;500;700;900&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Noto Sans KR',sans-serif}
.og{width:1200px;height:630px;position:relative;overflow:hidden;color:#fff;display:flex;align-items:center;
  background:radial-gradient(900px 500px at 80% 10%,rgba(122,92,255,.5),transparent 60%),
  radial-gradient(700px 500px at 5% 95%,rgba(43,217,229,.25),transparent 55%),
  linear-gradient(150deg,#0A1230 0%,#12206B 55%,#2740B8 100%)}
.og::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(0deg,transparent,transparent 55px,rgba(255,255,255,.04) 56px),
  repeating-linear-gradient(90deg,transparent,transparent 55px,rgba(255,255,255,.04) 56px)}
.left{position:relative;z-index:2;padding:0 0 0 80px;flex:1}
.lrow{display:flex;align-items:center;gap:14px}
.en{font-family:'Marcellus',serif;font-size:64px;letter-spacing:.04em}
.he{display:flex;flex-direction:column;gap:6px;font-family:'Outfit';font-size:20px;letter-spacing:.22em;color:#2BD9E5;font-weight:600}
.kr{display:flex;justify-content:space-between;width:430px;font-size:30px;font-weight:700;margin-top:12px}
.line{width:70px;height:4px;border-radius:4px;background:linear-gradient(90deg,#2A5CFF,#2BD9E5);margin:38px 0 26px}
.desc{font-size:27px;font-weight:500;line-height:1.55;color:rgba(255,255,255,.92)}
.desc b{color:#8FB0FF}
.items{margin-top:26px;font-family:'Outfit','Noto Sans KR';font-size:19px;letter-spacing:.06em;color:rgba(255,255,255,.6)}
.right{position:relative;z-index:2;width:430px;height:100%;display:flex;align-items:center;justify-content:center}
.orb{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(220,230,255,.85) 55%,transparent 72%)}
.right img{position:relative;width:360px;filter:drop-shadow(0 24px 40px rgba(0,0,0,.45))}
</style></head><body>
<div class="og">
  <div class="left">
    <div class="lrow"><span class="en">HYOSUNG</span><span class="he"><span>HEAVY</span><span>ELECTRIC</span></span></div>
    <div class="kr"><span>효</span><span>성</span><span>중</span><span>전</span><span>기</span></div>
    <div class="line"></div>
    <div class="desc">산업용 <b>동력·전력 설비</b> 전문기업<br>정확한 사양으로 공급합니다</div>
    <div class="items">전동기 · 기어드모터 · 싸이크로감속기 · 변압기</div>
  </div>
  <div class="right"><div class="orb"></div><img src="../img/lv-main.jpg"></div>
</div>
</body></html>
